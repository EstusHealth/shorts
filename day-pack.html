<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OT Driver Assessment Day Pack | Estus Health</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Barlow+Semi+Condensed:wght@500;600&family=Oswald:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --b1:#344982;--b2:#2f6f9e;--b3:#2ca5b8;--b4:#ab5c95;
  --ink:#111111;--ink2:#16151a;--muted:#55534e;--faint:#8a8880;
  --plum:#84406f;--blue:#2f6f9e;--teal:#2ca5b8;
  --canvas:#e9e7e4;--card:#fbfaf8;--white:#fff;--sand:#efe9db;
  --line:#d6d4cf;--line2:#e6e4df;
  --good:#1e8a5a;--good-soft:#e3f2ea;--warn:#a86a10;--warn-soft:#f8ecd6;--bad:#b23b30;--bad-soft:#f7e1de;
  --display:'Oswald','Arial Narrow',sans-serif;--body:'Barlow','Segoe UI',system-ui,sans-serif;--label:'Barlow Semi Condensed','Arial Narrow',sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{margin:0;background:var(--canvas);color:var(--ink2);font:16px/1.45 var(--body)}
button,input,select,textarea{font:inherit;color:inherit}
.bands{display:flex;gap:3px;height:6px}.bands span{flex:1}
.c1{background:var(--b1)}.c2{background:var(--b2)}.c3{background:var(--b3)}.c4{background:var(--b4)}
.kick{font-family:var(--label);font-weight:600;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--plum)}
.lab{font-family:var(--label);font-weight:600;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1,h2{font-family:var(--display);font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--ink);margin:0}
h1{font-size:34px;line-height:1.05;margin-top:4px}
h2{font-size:21px;margin:26px 0 10px}
h3{font-family:var(--label);font-weight:600;font-size:13.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--blue);margin:20px 0 8px}

/* layout */
.top{position:sticky;top:0;z-index:30;background:#111;color:#fff}
.top .bar{display:flex;align-items:center;gap:14px;padding:10px 16px;max-width:1240px;margin:0 auto}
.wm{display:flex;flex-direction:column;line-height:.85;margin-right:6px}
.wm b{font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.02em}
.wm i{font-style:normal;font-family:var(--display);font-weight:600;font-size:8.6px;letter-spacing:.3em;margin-top:2px}
.top .who{flex:1;min-width:0;font-size:14px;color:#cfd6e2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .who b{color:#fff}
.top .back{color:#cfd6e2;font-size:14px;text-decoration:none}
.top .back:hover{color:#fff}
.save{font-family:var(--label);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#7fd0dd}
.wrap{display:grid;grid-template-columns:250px 1fr;gap:22px;max-width:1240px;margin:0 auto;padding:18px 16px 80px}
nav.side{position:sticky;top:76px;align-self:start;background:var(--white);border:1px solid var(--line2);border-radius:12px;padding:8px}
nav.side a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--ink2);text-decoration:none;font-weight:500;font-size:15px}
nav.side a:hover{background:var(--card)}
nav.side a.on{background:#111;color:#fff}
nav.side a .n{font-family:var(--display);font-weight:600;width:20px;text-align:center;color:var(--blue)}
nav.side a.on .n{color:#7fd0dd}
nav.side a .dot{margin-left:auto;width:9px;height:9px;border-radius:50%;background:var(--line2);flex:none}
nav.side a .dot.part{background:var(--b3)}nav.side a .dot.done{background:var(--good)}
nav.side a .dot.flag{background:var(--bad)}
nav.side hr{border:0;border-top:1px solid var(--line2);margin:6px 4px}
main{min-width:0}
.view{background:var(--white);border:1px solid var(--line2);border-radius:14px;padding:26px 28px 30px}
.view + .view{margin-top:18px}
.meta{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;margin-top:10px;color:var(--muted)}
.pill{display:inline-block;font-family:var(--label);font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase;padding:4px 11px;border-radius:99px;background:#111;color:#fff}
.flagpill{display:inline-block;font-weight:600;font-size:13.5px;padding:3px 10px;border-radius:99px;line-height:1.35}
.flagpill.ok{background:var(--good-soft);color:var(--good)}.flagpill.warn{background:var(--warn-soft);color:var(--warn)}.flagpill.bad{background:var(--bad-soft);color:var(--bad)}
.flagpill.na{background:var(--card);color:var(--faint)}
.tabs2{display:flex;gap:6px;flex-wrap:wrap;margin:18px 0 2px;border-bottom:1px solid var(--line2)}
.tabs2 button{border:0;background:none;padding:9px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer}
.tabs2 button.on{color:var(--ink);border-bottom-color:var(--b4)}
.pane[hidden]{display:none}

/* run sheet */
ol.steps{list-style:none;counter-reset:s;margin:0;padding:0}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr 34px;gap:10px;align-items:start;padding:11px 0;border-bottom:1px solid var(--line2)}
ol.steps li:before{content:counter(s);font-family:var(--display);font-weight:600;font-size:20px;color:var(--b1);line-height:1.1}
ol.steps li.done > div{color:var(--faint)}
ol.steps b{color:var(--ink)}
.tick{width:26px;height:26px;accent-color:var(--good);cursor:pointer;margin:0}
ul.dots{list-style:none;margin:0;padding:0}
ul.dots li{position:relative;padding-left:16px;margin:5px 0}
ul.dots li:before{content:"";position:absolute;left:0;top:.58em;width:7px;height:7px;background:var(--b3)}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:26px}
.say{background:var(--sand);border-left:4px solid var(--b4);padding:12px 16px;border-radius:0 8px 8px 0;font-style:italic;margin-top:16px}
.say .lab{display:block;font-style:normal;color:var(--plum);margin-bottom:3px}
.alert{border:1.5px solid var(--b4);border-radius:10px;padding:12px 16px;margin-top:14px}
.alert .lab{color:var(--plum);display:block;margin-bottom:4px}
table.cut{width:100%;border-collapse:collapse;font-size:15px}
table.cut td{padding:7px 8px;border-bottom:1px solid var(--line2);vertical-align:top}
table.cut td:first-child{font-weight:600;width:36%}
.note{font-size:14px;color:var(--muted)}

/* record forms */
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px 14px}
.f{display:flex;flex-direction:column;gap:4px;grid-column:span 6}
.f.h2c{grid-column:span 3}.f.h3c{grid-column:span 2}.f.h1c{grid-column:span 1}
.f > span{font-size:13.5px;font-weight:600;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:#fff;min-height:42px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--b3);outline-offset:0;border-color:var(--b3)}
textarea{min-height:84px;resize:vertical;field-sizing:content}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;background:none;padding:9px 14px;cursor:pointer;font-weight:600;color:var(--muted);min-height:42px}
.seg button + button{border-left:1px solid var(--line)}
.seg button.on{background:#111;color:#fff}
.ynrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line2)}
table.rec{width:100%;border-collapse:collapse;font-size:15px}
table.rec th{text-align:left;font-family:var(--label);font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#fff;background:#111;padding:8px}
table.rec td{padding:5px 6px;border-bottom:1px solid var(--line2);vertical-align:middle}
table.rec td:first-child{font-weight:600}
table.rec select,table.rec input{min-height:38px;padding:6px 8px}
.timer{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:12px 14px;margin:10px 0}
.timer .name{font-weight:700;min-width:150px}
.timer .clock{font-family:var(--display);font-weight:500;font-size:28px;min-width:96px;font-variant-numeric:tabular-nums}
.timer input{width:96px}
.timer .grow{flex:1}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 14px;font-weight:600;cursor:pointer;min-height:42px}
.btn:hover{border-color:var(--muted)}
.btn.dark{background:#111;color:#fff;border-color:#111}
.btn.go{background:var(--good);border-color:var(--good);color:#fff}
.btn.stop{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.sm{padding:5px 10px;min-height:34px;font-size:14px}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.flags{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.flags:empty{display:none}
.out{font-weight:700}
.notes .nb{margin-bottom:12px}
.notes .nb > span{display:block;font-family:var(--label);font-weight:600;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--b1);margin-bottom:4px}
.notes textarea{min-height:110px}
.card{background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:14px 16px}
.list-check{list-style:none;margin:0;padding:0}
.list-check li{display:flex;gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line2)}
.list-check input{width:22px;height:22px;accent-color:var(--good)}
table.day{width:100%;border-collapse:collapse}
table.day th{text-align:left;font-family:var(--label);font-weight:600;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#fff;background:#111;padding:8px}
table.day td{padding:8px;border-bottom:1px solid var(--line2);vertical-align:top}
table.day td.t{font-family:var(--display);font-size:18px;width:60px}
table.day input[type=time]{min-height:36px;padding:4px 6px;width:110px}
.prog{height:8px;background:var(--line2);border-radius:99px;overflow:hidden}
.prog span{display:block;height:100%;background:var(--b3)}
.secgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px;margin-top:12px}
.secgrid a{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:12px 14px}
.secgrid a:hover{border-color:var(--muted)}
.secgrid .t{font-weight:700;margin:2px 0 8px}
.diag{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.diag figure{margin:0;background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:10px}
.diag figcaption{font-size:14.5px;margin-top:6px}
.diag svg{width:100%;height:auto;display:block;background:#fff;border-radius:8px}
.q{padding:12px 0;border-bottom:1px solid var(--line2)}
.q .opts{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.q label{display:flex;gap:9px;align-items:flex-start;cursor:pointer;padding:5px 8px;border-radius:8px}
.q label:hover{background:var(--card)}
.q input[type=radio]{width:20px;height:20px;margin-top:2px;accent-color:var(--b1)}
.key .ans{background:var(--good-soft)}
.q .why{display:none;font-size:14px;color:var(--good);margin:6px 0 0 8px}
.key .q .why{display:block}
.q .res{float:right}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:99px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}
.toast.show{opacity:.96}
.tally{display:inline-flex;align-items:center;gap:6px}
.tally b{min-width:22px;text-align:center;font-variant-numeric:tabular-nums}
#client{display:none}

@media (max-width:900px){
  .wrap{grid-template-columns:1fr}
  nav.side{position:static;display:flex;overflow-x:auto;gap:4px}
  nav.side a{white-space:nowrap}
  nav.side hr,nav.side a .dot{display:none}
  .cols{grid-template-columns:1fr}
  .f.h2c,.f.h3c{grid-column:span 6}
  .f.h1c{grid-column:span 3}
  .view{padding:20px 16px}
}

/* ---------- print ---------- */
@page{size:A4;margin:12mm 12mm 14mm}
@media print{
  body{background:#fff;font-size:10.5pt}
  .top,nav.side,.noprint,.btnrow,.tabs2,.toast,.timer .btn{display:none!important}
  .wrap{display:block;padding:0;max-width:none}
  .view{border:0;border-radius:0;padding:0;display:block!important;break-before:page}
  .view:first-child{break-before:auto}
  .pane{display:block!important}
  .pane + .pane{break-before:page}
  h1{font-size:22pt}h2{font-size:14pt;margin:14px 0 6px}
  input,select,textarea{border:0;border-bottom:1px solid #999;border-radius:0;min-height:0;padding:3px 2px;background:transparent}
  select{-webkit-appearance:none;appearance:none}
  textarea{min-height:22mm;border:1px solid #bbb;border-radius:4px}
  .notes textarea{min-height:30mm}
  .seg{border:0}.seg button{display:none;padding:2px 6px;min-height:0}.seg button.on{display:inline;background:none;color:#000;border:1px solid #000;border-radius:4px}
  body.blank .seg button{display:inline;background:none;color:#000}
  .timer{background:none;border:1px solid #ccc;padding:6px 10px}
  .timer .clock{display:none}
  .diag figure,.q,.timer,table.rec tr,ol.steps li,.nb,.card{break-inside:avoid}
  .say{background:#f4f1ea}
  body.print-client #app{display:none!important}
  body.print-client #client{display:block!important}
  .flagpill{border:1px solid currentColor}
  .grid{grid-template-columns:repeat(6,1fr)!important}
  .f.h2c{grid-column:span 3!important}.f.h3c{grid-column:span 2!important}.f.h1c{grid-column:span 1!important}
  .cols{grid-template-columns:1fr 1fr!important}
  .secgrid{grid-template-columns:repeat(4,1fr)}
  input::-webkit-calendar-picker-indicator{display:none}
  input[type=text],input[type=number],input[type=date],input[type=time],select{min-height:24px}
}
/* client sheets */
.sheet{break-after:page;font-size:12pt}
.sheet:last-child{break-after:auto}
.sheet .hd{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #111;padding-bottom:6px;margin-bottom:10px}
.sheet .hd .t{font-family:var(--display);font-weight:600;font-size:20pt;text-transform:uppercase}
.sheet .hd .bandsm{display:flex;gap:2px;width:90px;margin-bottom:4px}.sheet .hd .bandsm span{flex:1;height:5px}
.sheet .line{display:flex;gap:18px;margin:6px 0 10px;font-size:11.5pt}
.sheet .line span{flex:1;border-bottom:1px solid #000;min-height:20px}
.sheet svg{width:100%;display:block}
.sheet .qq{margin:0 0 9px;break-inside:avoid}
.sheet .qq ol{margin:3px 0 0 0;padding-left:22px;list-style:lower-alpha}
.sheet .dg{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px}
.sheet .dg figure{margin:0;break-inside:avoid;border:1px solid #bbb;border-radius:6px;padding:6px}
.sheet .dg figcaption{font-size:10.5pt}
.sheet p{margin:6px 0}
</style>
</head>
<body>
<div id="app">
<header class="top noprint">
  <div class="bands"><span class="c1"></span><span class="c2"></span><span class="c3"></span><span class="c4"></span></div>
  <div class="bar">
    <div class="wm"><b>ESTUS</b><i>HEALTH</i></div>
    <div class="who" id="who">OT Driver Assessment Day Pack</div>
    <span class="save" id="saveState">Saved on this device</span>
    <a class="back" href="./#driving">Driver OT tracker</a>
  </div>
</header>
<div class="wrap">
  <nav class="side noprint" id="nav" aria-label="Sections"></nav>
  <main id="views"></main>
</div>
</div>
<div id="client"></div>
<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';
var KEY = 'estus-day-pack-v1';
var $ = function(s, r){ return (r || document).querySelector(s); };
var $$ = function(s, r){ return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function toast(m){ var t = $('#toast'); t.textContent = m; t.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(function(){ t.classList.remove('show'); }, 1800); }

/* ======================= CONTENT ======================= */
var WA_LICENCE = [
  'Learner’s permit from 16, after passing the theory test. L plates front and back. Zero blood alcohol.',
  'Learners may drive up to 100 km/h where the limit allows it.',
  'Under 25: at least 50 supervised hours, including 5 at night, logged before the Practical Driving Assessment (PDA).',
  'Hazard Perception Test (HPT) after 6 months on L plates. It must be passed before the PDA.',
  'PDA from 17. Pass it and get P plates.',
  'Red P plates for the first 6 months: no driving midnight to 5 am, and only 1 passenger at all times (Tom’s Law, some exemptions). Then green P plates. Zero blood alcohol for all P platers.',
  'Announced April 2026, start date not set: 12 month learner period, 80 supervised hours (10 at night), 3 years on P plates, and a mobile phone ban for L and P drivers. Check transport.wa.gov.au before quoting these to families.'
];

var SECTIONS = [
 {id:'s1', n:1, title:'Welcome, consent and interview', mins:40,
  purpose:'Settle the client, get consent, sight documents and build the full picture of their health, driving and goals.',
  setup:['Quiet room, soft lighting, water on the table. Fidgets welcome.','Show the client the day plan so there are no surprises.','Licence or learner’s permit, driving glasses, medication list, referral and medical clearance ready.'],
  steps:[['Introduce','Who is here and their role. What today looks like, start to finish. Breaks are fine any time, just ask.'],
    ['Consent','Client signs the Estus consent form, including dash cam recording. Under 18 or a substitute decision maker: they sign too. Confirm who gets the report.'],
    ['Sight documents','WA licence or learner’s permit: number, class, conditions, expiry. Medical clearance or GP letter.'],
    ['Interview','Medical history, current symptoms, medications (name, dose, time taken today, side effects), driving history, driving needs, why driving matters, expectations.'],
    ['Neurodivergent extras','Sensory load in a car (noise, light, seat feel, smells). What helps them regulate. Anxiety about driving. Medication timing against drive time. Sleep last night. Eaten today. How past lessons felt.'],
    ['Self-efficacy','Adelaide Driving Self-Efficacy Scale (ADSES), printed from your licensed copy. Enter the 12 item scores below.']],
  say:'“Today has a few parts: some questions, some eye and movement checks, some pen and paper tasks, then a drive. I’ll tell you what’s next each time. You can ask for a break whenever you need one.”',
  watch:['Gap between what the client says and what family report (insight).','Masking: looks fine, but is working hard to hold it together.','Stimulant timing: will it wear off before or during the drive?'],
  scores:[],
  prompts:['Key history and goals','In their words (quotes worth using in the report)','Medication timing today and sleep','Sensory and regulation notes','Carry forward to the on-road and report']},
 {id:'s2', n:2, title:'Hearing and vision', mins:15,
  purpose:'Screen hearing, communication and vision against the Austroads private vehicle standard.',
  setup:['Eye chart at the right distance (6 m, or a 3 m chart). Measure it.','Pen torch, occluder or eye patch, two pens. Good even lighting.','Client wears their driving glasses for acuity. Off for fields and slow pursuits.'],
  steps:[['Hearing and communication','Hearing aids? Follows verbal instructions? Any communication issues seen?'],
    ['Visual history','Last optometrist or eye specialist visit. Glasses. Eye treatments. Symptoms: blur, double vision, missing areas, flashes.'],
    ['Visual acuity','Right, left, then both eyes. Uncorrected and corrected. Record 6/x. Up to 2 errors on a line still counts as that line.'],
    ['Visual fields','Confrontation, no glasses. Sit opposite at about 0.5 m, eyes level. Client covers one eye, you close your matching eye. Client looks into your open eye. Bring a finger in from 2 to 3 points per quadrant. Compare to your own field.'],
    ['Strabismus','Pen torch at 0.5 m. Light reflex in the same spot in both eyes? Cover and uncover each eye: movement of the uncovered eye means a deviation.'],
    ['Eye movements','Slow (no glasses): follow a pen at 30 cm through a wide H, head still. Fast (glasses on): two pens 10 cm either side of the nose, look quickly between them, horizontal then vertical, then near pen to far chart.'],
    ['Other','Colour vision, glare, night vision, contrast. Note nystagmus.']],
  say:'“Keep your head still and look right into my eye. Say ‘now’ as soon as you see my finger move.”',
  watch:['Confrontation is a screen only. It misses small field losses.','Fatigue, squinting, head tilt, or moving the head to track.'],
  scores:[['Visual acuity (private, unconditional)','6/12 or better with both eyes together, or in one eye, with the lenses worn for driving.'],
    ['Absolute floor','No licence if the better eye is worse than 6/24.'],
    ['Visual fields (private, unconditional)','At least 110° horizontal within 10° above and below the midline. No significant loss within 20° of fixation.'],
    ['Action','Below standard, or any doubt: refer to an optometrist or ophthalmologist for formal testing. Below the acuity standard: do not go on-road.']],
  prompts:['Acuity and fields summary','Eye movements and other findings','Possible impact on-road','Referrals needed']},
 {id:'s3', n:3, title:'Physical', mins:15,
  purpose:'Check the body can control the car: reach, grip, steer, pedal, check over the shoulder, and keep it up.',
  setup:['Firm chair without arms. All tests done sitting, like driving.','Two tape crosses on the floor at brake and accelerator spots. Stopwatch. Goniometer if needed.'],
  steps:[['Range of movement','Shoulders, elbows, forearms, wrists, fingers, hips, knees, ankles. Trunk and neck rotation for head checks.'],
    ['Strength','Oxford scale 0 to 5. Resist at the end of range. Grip both hands. Lower limb against resistance.'],
    ['Tone','Only if history or what you see points to it.'],

function flagsFor(sec){
  var f = [];
  if (sec === 's1'){
    if (V('lic_seen') === 'No') f.push(['bad','Licence or permit not sighted']);
    if (V('med_clear') === 'No') f.push(['bad','No medical clearance sighted']);
    var ad = adsesTotal(); if (ad != null) f.push(['ok','ADSES total ' + ad + ' / 120']);
  }
  if (sec === 's2'){
    var both = acuRank(V('va_cb')) != null ? acuRank(V('va_cb')) : acuRank(V('va_ub'));
    var best = [V('va_cr'),V('va_cl'),V('va_cb'),V('va_ur'),V('va_ul'),V('va_ub')].map(acuRank).filter(function(x){ return x != null; });
    var bestEye = [V('va_cr'),V('va_cl'),V('va_ur'),V('va_ul')].map(acuRank).filter(function(x){ return x != null; });
    if (best.length){
      var b = Math.min.apply(null, best);
      if (b <= 5) f.push(['ok','Acuity meets 6/12 (best ' + ACU[b] + ')']);
      else f.push(['bad','Acuity worse than 6/12 (best ' + ACU[b] + '): below private standard, do not go on-road, refer']);
    }
    if (bestEye.length && Math.min.apply(null, bestEye) > 8) f.push(['bad','Better eye worse than 6/24: below the absolute floor']);
    var q = ['vf_rr_u','vf_rr_l','vf_rl_u','vf_rl_l','vf_lr_u','vf_lr_l','vf_ll_u','vf_ll_l'];
    if (q.some(function(k){ return V(k) === 'Reduced'; })) f.push(['bad','Field loss on confrontation: refer for formal perimetry']);
    else if (q.every(function(k){ return V(k) === 'Full'; })) f.push(['ok','Fields full to confrontation (screen only)']);
    ['strab','nyst'].forEach(function(k){ if (V(k) === 'Present') f.push(['warn', (k === 'strab' ? 'Strabismus' : 'Nystagmus') + ' present: consider referral']); });
    if (V('pursuit') === 'No' || V('sacc') === 'No') f.push(['warn','Eye movements not smooth and accurate']);
    if (V('hear_follow') === 'No') f.push(['warn','Did not reliably follow verbal instructions']);
  }
  if (sec === 's3'){
    var reduced = PHYS.filter(function(j){ return /Reduced|Unable/.test(V('rom_' + j[0] + '_R') + V('rom_' + j[0] + '_L')); }).map(function(j){ return j[1]; });
    if (reduced.length) f.push(['warn','Reduced range: ' + reduced.join(', ')]);
    var weak = PHYS.filter(function(j){ var r = num('str_' + j[0] + '_R'), l = num('str_' + j[0] + '_L'); return (r != null && r < 4) || (l != null && l < 4); }).map(function(j){ return j[1]; });
    if (weak.length) f.push(['warn','Strength under 4/5: ' + weak.join(', ')]);
    ['R','L'].forEach(function(s){
      var taps = num('hp_taps_' + s), t = num('hp_time_' + s);
      if (taps != null && t != null){
        if (taps >= 15 && t < 9) f.push(['ok','Heel pivot ' + s + ': ' + taps + ' taps in ' + t + ' s']);
        else f.push(['warn','Heel pivot ' + s + ': ' + taps + ' taps in ' + t + ' s (target 15 in under 9 s)']);
      }
    });
    if (V('accbrake') === 'No') f.push(['warn','Accelerator and brake sequence not accurate']);
    if (V('prop_ul') === 'Impaired' || V('prop_ll') === 'Impaired') f.push(['warn','Proprioception impaired']);
    var p = num('pain'); if (p != null && p >= 4) f.push(['warn','Pain ' + p + '/10: may build over the drive']);
  }
  if (sec === 's4'){

function rot(x, y, deg){ var r = deg * Math.PI / 180, dx = x - 120, dy = y - 120; return [120 + dx * Math.cos(r) - dy * Math.sin(r), 120 + dx * Math.sin(r) + dy * Math.cos(r)]; }
function diagram(d, idx, print){
  var road = '#5f5e5a', line = '#fff', g = '';
  g += '<rect x="0" y="0" width="240" height="240" fill="#dfe8d6"/>';
  if (d.type === 'X' || d.type === 'R'){
    g += '<rect x="0" y="90" width="240" height="60" fill="' + road + '"/><rect x="90" y="0" width="60" height="240" fill="' + road + '"/>';
    g += '<path d="M0 120H88M152 120H240M120 0V88M120 152V240" stroke="' + line + '" stroke-width="2" stroke-dasharray="8 7"/>';
  }
  if (d.type === 'T'){
    g += '<rect x="0" y="90" width="240" height="60" fill="' + road + '"/><rect x="90" y="150" width="60" height="90" fill="' + road + '"/>';
    g += '<path d="M0 120H240M120 152V240" stroke="' + line + '" stroke-width="2" stroke-dasharray="8 7"/>';
  }
  if (d.type === 'R'){
    g += '<circle cx="120" cy="120" r="44" fill="' + road + '"/><circle cx="120" cy="120" r="18" fill="#cfdcc4" stroke="#fff" stroke-width="2"/>';
  }
  if (d.stops) d.stops.forEach(function(a){ var p = rot(76, 168, a); g += '<g transform="translate(' + p[0] + ',' + p[1] + ')"><polygon points="-9,-4 -4,-9 4,-9 9,-4 9,4 4,9 -4,9 -9,4" fill="#c8102e" stroke="#fff" stroke-width="1"/><text x="0" y="2.6" font-size="5.6" font-weight="700" fill="#fff" text-anchor="middle" font-family="Arial">STOP</text></g>'; var sl = rot(90, 153, a), sl2 = rot(120, 153, a); g += '<line x1="' + sl[0] + '" y1="' + sl[1] + '" x2="' + sl2[0] + '" y2="' + sl2[1] + '" stroke="#fff" stroke-width="3"/>'; });
  if (d.lights) [0,90,180,270].forEach(function(a){ var p = rot(78, 160, a); g += '<g transform="translate(' + p[0] + ',' + p[1] + ')"><rect x="-4" y="-11" width="8" height="22" rx="2" fill="#222"/><circle cx="0" cy="-6" r="2.4" fill="#444"/><circle cx="0" cy="0" r="2.4" fill="#444"/><circle cx="0" cy="6" r="2.6" fill="#2ecc71"/></g>'; });
  if (d.ped){
    g += pedIcon(143, 172);
    g += '<path d="M134 172 H98" stroke="#111" stroke-width="1.6" stroke-dasharray="3 2" fill="none" marker-end="url(#ah' + idx + ')"/>';
    g += label('P', 166, 176);
  }
  d.cars.forEach(function(c){
    var name = c[0], a = c[1], mv = c[2];
    if (a === 'ring'){
      // car inside the roundabout, west side, circulating clockwise (heading north)
      g += '<g transform="translate(84,124) rotate(0)"><rect x="-6" y="-10" width="12" height="20" rx="3" fill="#2f6f9e" stroke="#111" stroke-width="1"/><rect x="-4.5" y="-8" width="9" height="5" rx="1" fill="#cfe6f5"/></g>';
      g += '<path d="M84 110 A36 36 0 0 1 106 87" stroke="#111" stroke-width="1.8" fill="none" marker-end="url(#ah' + idx + ')"/>';
      g += label(name, 70, 140);
      return;
    }
    var p = rot(105, 196, a);
    var col = name === 'A' ? '#ab5c95' : name === 'B' ? '#2f6f9e' : '#2ca5b8';
    g += '<g transform="translate(' + p[0] + ',' + p[1] + ') rotate(' + a + ')"><rect x="-7" y="-12" width="14" height="24" rx="3" fill="' + col + '" stroke="#111" stroke-width="1"/><rect x="-5" y="-10" width="10" height="6" rx="1" fill="#e8f3fb"/></g>';
    var path;
    if (d.type === 'R') path = 'M105 180 L105 168';
    else if (mv === 's') path = 'M105 180 L105 66';
    else if (mv === 'r') path = 'M105 180 L105 138 Q105 105 138 105 L176 105';
    else path = 'M105 180 L105 152 Q105 135 88 135 L64 135';
    var pts = path.match(/-?\d+(\.\d+)?/g).map(Number), out = [], k = 0;
    var cmd = path.replace(/-?\d+(\.\d+)?/g, function(){ return '@'; });
    for (var i = 0; i < pts.length; i += 2){ var r2 = rot(pts[i], pts[i + 1], a); out.push(r2[0].toFixed(1) + ' ' + r2[1].toFixed(1)); }
    var built = cmd.replace(/@ @/g, function(){ return out[k++]; });
    g += '<path d="' + built + '" stroke="#111" stroke-width="1.8" fill="none" marker-end="url(#ah' + idx + ')"/>';
    var lp = rot(84, 206, a);
    g += label(name, lp[0], lp[1]);
  });
  return '<svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="' + esc(d.title) + '"><defs><marker id="ah' + idx + '" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111"/></marker></defs>' + g + '</svg>';
}

    '<p><b>The report can be sent to:</b> &nbsp;☐ me &nbsp;☐ my referrer &nbsp;☐ my GP &nbsp;☐ my NDIS plan manager or support coordinator &nbsp;☐ other: ______________________</p>' +
    '<p><b>Dash cam recording:</b> &nbsp;☐ I agree &nbsp;☐ I do not agree</p>' +
    '<table style="width:100%;margin-top:18px;border-collapse:collapse">' + ['Client','Parent, guardian or decision maker (if needed)','Occupational therapist'].map(function(r){ return '<tr><td style="padding:14px 0 4px;width:42%">' + r + '</td><td style="border-bottom:1px solid #000">Signed</td><td style="border-bottom:1px solid #000;width:22%">Date</td></tr>'; }).join('') + '</table></section>');
  p.push('<section class="sheet">' + sheetHead('Trail Making Part A: Sample') + '<div style="max-width:150mm;margin:18mm auto 0">' + tmtSvg(TMT.AS, 600, 370, 20, tag('Begin', 0.499 * 600, 0.609 * 370 + 40) + tag('End', 0.445 * 600, 0.304 * 370 - 28)) + '</div></section>');
  p.push('<section class="sheet">' + sheetHead('Trail Making Part A') + nameLine() + '<div style="max-width:178mm;margin:2mm auto 0">' + tmtSvg(TMT.A, 600, 730, 19) + '</div></section>');
  p.push('<section class="sheet">' + sheetHead('Trail Making Part B: Sample') + '<div style="max-width:150mm;margin:18mm auto 0">' + tmtSvg(TMT.BS, 600, 370, 20, tag('Begin', 0.451 * 600, 0.550 * 370 + 40) + tag('End', 0.317 * 600, 0.298 * 370 - 28)) + '</div></section>');
  p.push('<section class="sheet">' + sheetHead('Trail Making Part B') + nameLine() + '<div style="max-width:178mm;margin:2mm auto 0">' + tmtSvg(TMT.B, 600, 715, 19) + '</div></section>');
  p.push('<section class="sheet">' + sheetHead('Clock drawing') + nameLine() + '<p style="font-size:13pt;margin-top:10mm">“Please draw a clock. Put in all the numbers and set the time to ten past eleven.”</p></section>');
  p.push('<section class="sheet">' + sheetHead('WA road law and road craft', '<p style="font-size:10.5pt">Circle one answer for each question.</p>') + nameLine() +
    WAQ.map(function(q, i){ return '<div class="qq"><b>' + (i + 1) + '. ' + esc(q[0]) + '</b><ol>' + q[1].map(function(o){ return '<li>' + esc(o) + '</li>'; }).join('') + '</ol></div>'; }).join('') + '</section>');
  for (var pg = 0; pg < 2; pg++){
    p.push('<section class="sheet">' + sheetHead('WA intersections', pg === 0 ? '<p style="font-size:10.5pt">Write the order the road users go: 1st, 2nd, 3rd. P is a pedestrian. Arrows show where each vehicle is going.</p>' : '') +
      '<div class="dg">' + WAD.slice(pg * 4, pg * 4 + 4).map(function(d, j){ var i = pg * 4 + j; return '<figure>' + diagram(d, 100 + i, true) + '<figcaption><b>' + (i + 1) + '. ' + esc(d.title) + '</b><br>1st ______ &nbsp; 2nd ______' + (d.ans.length > 2 ? ' &nbsp; 3rd ______' : '') + '</figcaption></figure>'; }).join('') + '</div></section>');
  }
  return p.join('');
}

/* ======================= TIMERS ======================= */
var running = {};
function fmtClock(ms){ var s = ms / 1000, m = Math.floor(s / 60); return m + ':' + ('0' + (s - m * 60).toFixed(1)).slice(-4); }
function syncTimers(){ $$('[data-timer]').forEach(function(el){ var id = el.getAttribute('data-timer'), r = running[id], b = el.querySelector('[data-t="start"]');
  if (r){ b.textContent = 'Stop'; b.className = 'btn stop sm'; } else { b.textContent = 'Start'; b.className = 'btn go sm'; var t = num(id + '_t'); el.querySelector('.clock').textContent = t != null ? fmtClock(t * 1000) : '0:00.0'; } }); }
setInterval(function(){ Object.keys(running).forEach(function(id){ var el = $('[data-timer="' + id + '"] .clock'); if (el) el.textContent = fmtClock(Date.now() - running[id]); }); }, 100);

/* ======================= EVENTS ======================= */
document.addEventListener('input', function(e){
  var t = e.target;
  if (t.hasAttribute && t.hasAttribute('data-k')){ S.v[t.getAttribute('data-k')] = t.type === 'radio' ? t.value : t.value; save(); refreshFlags(); if (/^m_/.test(t.getAttribute('data-k'))) updateWho(); }
  if (t.hasAttribute && t.hasAttribute('data-row')){ var r = S.rows[t.getAttribute('data-row')][+t.getAttribute('data-i')]; r[t.getAttribute('data-c')] = t.value; save(); }
});
document.addEventListener('change', function(e){
  var t = e.target;
  if (t.hasAttribute && t.hasAttribute('data-k') && (t.tagName === 'SELECT' || t.type === 'radio')){ S.v[t.getAttribute('data-k')] = t.value; save(); refreshFlags(); }
  if (t.hasAttribute && t.hasAttribute('data-chk')){ S.c[t.getAttribute('data-chk')] = t.checked; var li = t.closest('ol.steps li'); if (li) li.classList.toggle('done', t.checked); save(); refreshFlags(); }
  if (t.id === 'importFile' && t.files && t.files[0]){ var fr = new FileReader(); fr.onload = function(){ try { var d = JSON.parse(fr.result); if (!d || !d.v) throw 0; S = Object.assign(blankState(), d); save(); render(route); toast('Imported'); } catch(err){ toast('That file is not a day pack export'); } }; fr.readAsText(t.files[0]); t.value = ''; }
});
document.addEventListener('click', function(e){
  var b = e.target.closest('button, a[data-r]'); if (!b) return;
  if (b.parentElement && b.parentElement.hasAttribute('data-seg')){ var k = b.parentElement.getAttribute('data-seg'), v = b.getAttribute('data-val'); S.v[k] = S.v[k] === v ? '' : v; $$('button', b.parentElement).forEach(function(x){ x.classList.toggle('on', S.v[k] === x.getAttribute('data-val')); }); save(); refreshFlags(); return; }
  if (b.hasAttribute('data-tab')){ var sec = b.parentElement.getAttribute('data-sec'); S._tab = S._tab || {}; S._tab[sec] = b.getAttribute('data-tab'); $$('[data-tab]', b.parentElement).forEach(function(x){ x.classList.toggle('on', x === b); }); $$('.pane').forEach(function(p){ p.hidden = p.getAttribute('data-pane') !== S._tab[sec]; }); save(); return; }
  if (b.hasAttribute('data-addrow')){ S.rows[b.getAttribute('data-addrow')].push({}); save(); render(route); return; }
  if (b.hasAttribute('data-delrow')){ var rr = S.rows[b.getAttribute('data-delrow')]; rr.splice(+b.getAttribute('data-i'), 1); if (!rr.length) rr.push({}); save(); render(route); return; }
  if (b.hasAttribute('data-tal')){ var row = S.rows.stages[+b.getAttribute('data-i')], c = b.getAttribute('data-tal'); row[c] = Math.max(0, (row[c] || 0) + (+b.getAttribute('data-d'))); b.parentElement.querySelector('b').textContent = row[c]; save(); refreshFlags(); return; }
  if (b.hasAttribute('data-t')){ var tel = b.closest('[data-timer]'), id = tel.getAttribute('data-timer');
    if (b.getAttribute('data-t') === 'start'){ if (running[id]){ var secs = Math.round((Date.now() - running[id]) / 100) / 10; delete running[id]; S.v[id + '_t'] = String(secs); tel.querySelector('[data-k="' + id + '_t"]').value = secs; save(); refreshFlags(); } else running[id] = Date.now(); }
    else { delete running[id]; S.v[id + '_t'] = ''; tel.querySelector('[data-k="' + id + '_t"]').value = ''; save(); refreshFlags(); }
    syncTimers(); return; }
  if (b.id === 'keyBtn'){ S._key = !S._key; render(route); return; }
  if (b.hasAttribute('data-go')){ location.hash = '#' + b.getAttribute('data-go'); return; }
  if (b.hasAttribute('data-print')){ doPrint(b.getAttribute('data-print')); return; }
  if (b.id === 'exportBtn'){ var blob = new Blob([JSON.stringify(S, null, 2)], {type:'application/json'}); var a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'day-pack-' + (V('m_client') || 'client').replace(/[^\w-]+/g, '-') + '-' + (V('m_date') || new Date().toISOString().slice(0, 10)) + '.json'; document.body.appendChild(a); a.click(); a.remove(); return; }
  if (b.id === 'importBtn'){ $('#importFile').click(); return; }
  if (b.id === 'newBtn'){ if (confirm('Start a new assessment? This clears everything saved here. Export first if you need it.')){ S = blankState(); save(); location.hash = '#overview'; render('overview'); toast('New assessment started'); } return; }
});
function doPrint(mode){
  document.body.classList.remove('print-client','blank');
  if (mode === 'client'){ $('#client').innerHTML = clientSheets(); document.body.classList.add('print-client'); window.print(); return; }
  if (mode === 'blank'){ pendingRestore = S; S = blankState(); document.body.classList.add('blank'); }
  renderAllForPrint();
  window.print();
  if (!('onafterprint' in window)) restoreAfterPrint();
}
var pendingRestore = null;
function restoreAfterPrint(){ if (pendingRestore){ S = pendingRestore; pendingRestore = null; } document.body.classList.remove('print-client','blank'); render(route); }
window.addEventListener('afterprint', restoreAfterPrint);
window.addEventListener('hashchange', function(){ render(location.hash.slice(1)); window.scrollTo(0, 0); });
window.__dayPack = {state:function(){ return S; }, clientSheets:clientSheets, renderAllForPrint:renderAllForPrint, render:render, blank:function(){ S = blankState(); }};

load();
render(location.hash.slice(1) || 'overview');
})();
</script>
</body>
</html>
